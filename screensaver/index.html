
<!DOCTYPE html>
<html>
<head>
<title>Floating Hearts</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background-color: black;
  overflow: hidden;
  transition: background-color 2s;
}

body:hover {
  background-color: #4b102c;
}

.heart {
  position: absolute;
  font-size: 50px;
  animation: float 4s infinite alternate ease-in-out;
  animation-play-state: paused;
}

body:hover .heart {
  animation-play-state: running;
}

.heart:nth-of-type(1) {
  top: 20%;
  left: 15%;
}

.heart:nth-of-type(2) {
  top: 60%;
  left: 40%;
  animation-delay: 1s;
}

.heart:nth-of-type(3) {
  top: 30%;
  left: 75%;
  animation-delay: 2s;
}

.heart:nth-of-type(4) {
  top: 75%;
  left: 80%;
  animation-delay: 0.5s;
}

.heart:nth-of-type(5) {
  top: 45%;
  left: 55%;
  animation-delay: 1.5s;
}

@keyframes float {
  from {
    transform: translateY(0px) rotate(0deg);
  }

  to {
    transform: translateY(-150px) rotate(30deg);
  }
}
</style>
</head>

<body>

<div class="heart">💗</div>
<div class="heart">💕</div>
<div class="heart">❤️</div>
<div class="heart">💖</div>
<div class="heart">💓</div>

</body>
</html>
